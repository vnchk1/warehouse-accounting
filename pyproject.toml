[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse"
version = "0.1.0"
description = "Складской учёт: материалы, поставщики и поступления на склад"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends(...) в значении по умолчанию — идиома FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Предупреждения сторонних библиотек, на код проекта не влияющие: их выдаёт
# тестовый клиент Starlette. Скрыты, чтобы отчёт о прогоне оставался чистым и
# в нём были видны предупреждения самого приложения.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
