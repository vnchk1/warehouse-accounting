# Подготовка задания CI: те же версии, что у разработчика (make install, make tools).
# Кэшируются загрузки pip (по pyproject.toml), инструменты .tools (по tools/tools.lock)
# и клиент PostgreSQL берётся той же основной версии, что сервер (16).
name: Окружение проекта
description: Python, зафиксированные зависимости, инструменты проверки, клиент PostgreSQL

inputs:
  python:
    description: Виртуальное окружение .venv с зависимостями проекта (make install)
    default: "true"
  tools:
    description: gitleaks, trivy, actionlint из tools/tools.lock (make tools)
    default: "false"
  postgres-client:
    description: pg_dump и pg_restore версии 16 (резервное копирование)
    default: "false"

runs:
  using: composite
  steps:
    - name: Python 3.12 (кэш загрузок pip)
      if: inputs.python == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Зависимости проекта (make install)
      if: inputs.python == 'true'
      shell: bash
      run: |
        python -m venv .venv
        make install
        .venv/bin/python -m pip check

    - name: Кэш инструментов проверки
      if: inputs.tools == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tools
        key: tools-${{ runner.os }}-${{ hashFiles('tools/tools.lock', 'tools/install_tools.sh') }}

    - name: Инструменты проверки (make tools)
      if: inputs.tools == 'true'
      shell: bash
      run: make tools

    - name: Клиент PostgreSQL 16
      if: inputs.postgres-client == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends postgresql-client-16
        echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
        /usr/lib/postgresql/16/bin/pg_dump --version
