# CI «Складской учёт» (ЛР5): независимый обязательный барьер перед сборкой и публикацией
# образа. Подробности — docs/CI.md.
#
#   ci-image ─┬─► guard ─┐
#             ├─► style ─┤
#             ├─► tests ─┤
#             ├─► migrations ─┤
#             ├─► backup ─┼──────────────────────────────► publish (только master: реестр на wa-app01)
#             ├─► security ─┤
#             └─► container ──► build ──► image-scan ─┘
#
# Все проверки выполняются в DinD: раннер поднимает контейнер docker:dind
# (изолированный демон Docker, образ закреплён в env DIND_IMAGE), а каждая команда
# make запускается в контейнере проверок внутри этого демона (tools/ci_dind.sh);
# PostgreSQL — контейнер в той же сети DinD, его образ берётся из compose.yaml.
# Каждое задание выполняет те же команды make, что make verify и make container-check
# у разработчика, с теми же версиями (образ проверок — Dockerfile.checks, собирается
# заданием ci-image один раз на прогон). Совпадение проверяет make guard.
# Образ публикуется, только если успешны ВСЕ задания проверки (needs без always()).
# Критический файл приёмки: изменения одобряют владельцы из .github/CODEOWNERS.

name: CI

on:
  # отправка изменений в любую ветку, в том числе в master после слияния
  push:
    branches: ["**"]
  # запрос на слияние в основную ветку; метки — для согласованного ослабления (make guard)
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # ручной запуск для любой ветки (демонстрация остановки на ошибке)
  workflow_dispatch:

# Токен заданий может только читать репозиторий
permissions:
  contents: read

# Новая отправка в ту же ветку отменяет устаревший прогон; в master прогоны не отменяются
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # основная ветка: с ней make guard и make secrets сравнивают изменения
  BASE_REF: origin/master
  # Изолированный демон Docker для всех проверок (DinD); закреплён версией и
  # дайджестом — это проверяет make guard
  DIND_IMAGE: docker:29.1.3-dind@sha256:173f284a4299164772a90f52b373e73e087583c0963f1334c9995f190ef6f3f5

jobs:
  # -------------------------------------------------------------------------
  # Образ проверок (Dockerfile.checks): Python, пакеты из pyproject.toml,
  # gitleaks/trivy/actionlint из tools/tools.lock, клиент PostgreSQL 16.
  # Собирается один раз на прогон; задания проверок загружают его в свой DinD.
  # -------------------------------------------------------------------------
  ci-image:
    name: Образ проверок
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Сборка образа проверок
        run: |
          tag=$(make -s image-tag)
          docker build -f Dockerfile.checks -t "warehouse-ci:$tag" .
          mkdir -p ci-image
          docker save "warehouse-ci:$tag" | gzip -1 > ci-image/ci-image.tar.gz
          (cd ci-image && sha256sum ci-image.tar.gz > ci-image/ci-image.tar.gz.sha256)
          echo "Образ проверок warehouse-ci:$tag, файл $(cut -c1-19 ci-image/ci-image.tar.gz.sha256)…, $(du -h ci-image/ci-image.tar.gz | cut -f1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image
          path: ci-image/
          retention-days: 7
          compression-level: 0

  # -------------------------------------------------------------------------
  # Охрана приёмки: pipeline, CODEOWNERS, удаление тестов и ослабление правил
  # -------------------------------------------------------------------------
  guard:
    name: Охрана приёмки
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - name: DinD и контейнер проверок
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
        run: bash tools/ci_dind.sh up
      - name: Программа охраны — из основной ветки
        # Изменение tools/ci_guard.py в запросе на слияние не может ослабить проверку
        # этого же запроса: действует версия, уже прошедшая проверку и слияние.
        run: bash tools/ci_dind.sh guard-from-base
      - name: make guard
        run: bash tools/ci_dind.sh exec make guard
      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-guard
          path: reports/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Стиль кода и правила проекта
  # -------------------------------------------------------------------------
  style:
    name: Стиль и правила проекта
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - name: DinD и контейнер проверок
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
        run: bash tools/ci_dind.sh up
      - name: make policy
        run: bash tools/ci_dind.sh exec make policy
      - name: make format-check
        run: bash tools/ci_dind.sh exec make format-check
      - name: make lint-check
        run: bash tools/ci_dind.sh exec make lint-check

  # -------------------------------------------------------------------------
  # Тесты: отдельная тестовая база — контейнер в той же сети DinD, тот же
  # образ PostgreSQL, что в compose.yaml
  # -------------------------------------------------------------------------
  tests:
    name: Тесты
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - name: DinD, контейнер проверок и PostgreSQL
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: bash tools/ci_dind.sh up --db
      - name: make test
        run: bash tools/ci_dind.sh exec make test
      - name: make mutation
        run: bash tools/ci_dind.sh exec make mutation
      - name: Отчёты тестов, покрытия и мутационной проверки
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-tests
          path: reports/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Миграции: пустая база → последняя версия → откат по шагу → снова последняя
  # -------------------------------------------------------------------------
  migrations:
    name: Миграции
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - name: DinD, контейнер проверок и PostgreSQL
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: bash tools/ci_dind.sh up --db
      - name: make migrations-check
        run: bash tools/ci_dind.sh exec make migrations-check
      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-migrations
          path: reports/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Резервное копирование: копия → повреждение → восстановление
  # -------------------------------------------------------------------------
  backup:
    name: Резервное копирование
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - name: DinD, контейнер проверок и PostgreSQL
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: bash tools/ci_dind.sh up --db
      - name: make backup-check
        run: bash tools/ci_dind.sh exec make backup-check
      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-backup
          path: reports/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Безопасность: анализ кода, поиск секретов, уязвимости зависимостей
  # -------------------------------------------------------------------------
  security:
    name: Безопасность
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # make secrets проверяет и коммиты ветки, а не только файлы
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - name: DinD и контейнер проверок
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
        run: bash tools/ci_dind.sh up
      - name: make sast
        run: bash tools/ci_dind.sh exec make sast
      - name: make secrets
        run: bash tools/ci_dind.sh exec make secrets
      - name: make deps-audit
        run: bash tools/ci_dind.sh exec make deps-audit
      - name: Отчёты анализаторов
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-security
          path: reports/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Контейнерная проверка файлов окружения (до сборки)
  # -------------------------------------------------------------------------
  container:
    name: Контейнерная проверка
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - name: DinD и контейнер проверок
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
        run: bash tools/ci_dind.sh up
      - name: Пароли контейнеров (одноразовые, make container-env)
        run: bash tools/ci_dind.sh exec make container-env
      - name: make container-policy
        run: bash tools/ci_dind.sh exec make container-policy

  # -------------------------------------------------------------------------
  # Сборка образа с тегом коммита и проверка собранного образа; сборка
  # выполняется демоном DinD (контейнер проверок работает с ним по сети)
  # -------------------------------------------------------------------------
  build:
    name: Сборка образа
    needs: [ci-image, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - name: DinD и контейнер проверок
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
        run: bash tools/ci_dind.sh up --docker
      - name: Тег образа связан с коммитом
        id: tag
        run: |
          tag=$(bash tools/ci_dind.sh exec make -s image-tag)
          if [[ $tag != *-"${GITHUB_SHA::12}" ]]; then
            echo "::error::тег $tag не содержит коммит ${GITHUB_SHA::12}"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Тег образа: warehouse-app:$tag (коммит $GITHUB_SHA)"
      - name: Пароли контейнеров (одноразовые, make container-env)
        run: bash tools/ci_dind.sh exec make container-env
      - name: make container-build
        run: bash tools/ci_dind.sh exec make container-build
      - name: make container-image-check
        run: bash tools/ci_dind.sh exec make container-image-check
      - name: Образ для следующих заданий
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p image
          # Отпечаток образа, не зависящий от хранилища Docker (ID у containerd и у классического
          # хранилища разный): контрольная сумма файла образа и список слоёв (diff_id).
          docker image inspect --format '{{json .RootFS.Layers}}' "warehouse-app:$TAG" > image/image-layers.json
          docker save "warehouse-app:$TAG" | gzip -1 > image/image.tar.gz
          (cd image && sha256sum image.tar.gz > image.tar.gz.sha256)
          echo "Образ warehouse-app:$TAG, файл $(cut -c1-19 image/image.tar.gz.sha256)…, $(du -h image/image.tar.gz | cut -f1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image/
          retention-days: 7
          compression-level: 0

  # -------------------------------------------------------------------------
  # Анализ собранного образа: уязвимости пакетов ОС и Python
  # -------------------------------------------------------------------------
  image-scan:
    name: Анализ образа
    needs: [ci-image, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: DinD и контейнер проверок
        env:
          CI_IMAGE_TAR: ${{ runner.temp }}/ci-image/ci-image.tar.gz
        run: bash tools/ci_dind.sh up --docker
      - name: Загрузка проверенного образа в DinD
        run: |
          (cd "$RUNNER_TEMP/image" && sha256sum --check --quiet image.tar.gz.sha256)
          gunzip -c "$RUNNER_TEMP/image/image.tar.gz" | docker load
          test "$(docker image inspect --format '{{json .RootFS.Layers}}' "warehouse-app:$APP_IMAGE_TAG")" \
            = "$(cat "$RUNNER_TEMP/image/image-layers.json")"
      - name: Дата для кэша базы уязвимостей
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Кэш базы уязвимостей trivy (обновляется раз в сутки)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          key: trivy-db-${{ steps.today.outputs.date }}
          restore-keys: trivy-db-
      - name: make image-scan
        run: |
          bash tools/ci_dind.sh cache-load trivy
          bash tools/ci_dind.sh exec make image-scan
          bash tools/ci_dind.sh cache-save trivy
      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-image-scan
          path: reports/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Публикация в локальный реестр на wa-app01 — только после успеха всех проверок.
  # Выполняется на self-hosted runner стенда; код репозитория там не запускается:
  # публикуется ровно тот файл образа, который собрало и проверило задание build.
  # -------------------------------------------------------------------------
  publish:
    name: Публикация образа
    needs: [guard, style, tests, migrations, backup, security, container, build, image-scan]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, warehouse-registry]
    # окружение с секретами реестра; доступно только ветке master (docs/CI.md)
    environment: registry
    timeout-minutes: 15
    env:
      APP_IMAGE_TAG: ${{ needs.build.outputs.tag }}
      REGISTRY: 127.0.0.1:5000
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Загрузка образа и сверка с проверенным
        run: |
          # тот же файл, что проверен в «Анализ образа», и те же слои после загрузки
          if ! (cd "$RUNNER_TEMP/image" && sha256sum --check --quiet image.tar.gz.sha256); then
            echo "::error::файл образа не совпадает с проверенным"
            exit 1
          fi
          gunzip -c "$RUNNER_TEMP/image/image.tar.gz" | docker load
          expected=$(cat "$RUNNER_TEMP/image/image-layers.json")
          actual=$(docker image inspect --format '{{json .RootFS.Layers}}' "warehouse-app:$APP_IMAGE_TAG")
          if [[ $actual != "$expected" ]]; then
            echo "::error::слои загруженного образа не совпадают с проверенным"
            exit 1
          fi
      - name: Публикация в реестр
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          target="$REGISTRY/warehouse-app:$APP_IMAGE_TAG"
          # учётные данные — во временном каталоге задания, а не в домашнем каталоге runner
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          printf '%s' "$REGISTRY_PASSWORD" |
            docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          docker tag "warehouse-app:$APP_IMAGE_TAG" "$target"
          docker push "$target"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$target")
          docker logout "$REGISTRY"
          docker image rm "$target" "warehouse-app:$APP_IMAGE_TAG" >/dev/null
          {
            echo "## Образ опубликован"
            echo ""
            echo "- тег: \`$target\`"
            echo "- коммит: \`$GITHUB_SHA\`"
            echo "- дайджест: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Опубликован $target ($digest)"
