# Nginx — единственная точка входа в окружение (дополнительное задание ЛР4).
# Процесс работает от пользователя nginx (UID 101), а не от root, поэтому слушает
# непривилегированный порт 8080 внутри контейнера; наружу он публикуется как HTTP_PORT (80).
# Файловая система контейнера только для чтения: всё временное — в /tmp (tmpfs).

worker_processes 1;                 # контейнеру выделено 0,5 CPU — одного процесса достаточно
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;              # не сообщать версию Nginx в ответах

    # в журнале видно, какой экземпляр приложения обработал запрос
    log_format balanced '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr instance=$upstream_http_x_instance_id '
                        'time=$request_time';
    access_log /dev/stdout balanced;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 1m;

    # DNS Docker: имя app возвращает адреса всех экземпляров. Параметр resolve ниже
    # перечитывает их каждые 5 с — новые экземпляры (--scale) и пересозданные
    # контейнеры с другими адресами подхватываются без перезапуска Nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream warehouse_app {
        zone warehouse_app 64k;     # общая память для адресов, полученных через resolve
        # по умолчанию — по очереди (round robin); экземпляр, не ответивший
        # 1 раз, исключается на 10 с
        server app:8000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # проверка самого Nginx (healthcheck контейнера), без обращения к приложению
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://warehouse_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            # отказоустойчивость: если экземпляр недоступен или остановлен, запрос
            # повторяется на другом (небезопасные запросы — только если не были отправлены)
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;

            # адрес экземпляра, обработавшего запрос (вместе с X-Instance-Id от приложения)
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
