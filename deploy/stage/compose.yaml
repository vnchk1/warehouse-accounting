# Предэксплуатационное окружение «Складской учёт» (ЛР6) — ВМ wa-stage01.
#
# Отличия от compose.yaml в корне (окружение разработчика):
#   - образ НЕ собирается на сервере: секции build нет, образ только из реестра
#     ${REGISTRY}/warehouse-app:${APP_IMAGE_TAG} (п. 3 задания);
#   - настройки окружения — файлы env/*.env на сервере, в образ и в git не попадают (п. 4);
#   - развертывание — deploy.sh <тег>, проверка релиза — verify.sh <тег>.
#
#   nginx ──(backend, внутренняя)──► app × 2 ──(data, внутренняя)──► db ◄── volume pgdata
#     ▲                                 ▲
#     └ единственный опубликованный порт └ migrate: миграции и начальные данные перед запуском app

name: warehouse-stage

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    <<: *hardening
    user: postgres
    restart: unless-stopped
    env_file:
      - ./env/db.env
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200
        reservations:
          memory: 256M
    logging: *logging

  # Миграции (роль wh_owner) и начальные данные (роль wh_app); завершается
  # после выполнения. Экземпляры app запускаются только после успешного завершения.
  migrate:
    image: ${REGISTRY:-192.168.253.130:5000}/warehouse-app:${APP_IMAGE_TAG:?тег образа обязателен — deploy.sh <тег>}
    <<: *hardening
    read_only: true
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && alembic current && python -m app.seed"]
    env_file:
      - ./env/app.env
      - ./env/migrate.env
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 50
    logging: *logging

  app:
    image: ${REGISTRY:-192.168.253.130:5000}/warehouse-app:${APP_IMAGE_TAG:?тег образа обязателен — deploy.sh <тег>}
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=16m
    restart: unless-stopped
    env_file:
      - ./env/app.env
    environment:
      SESSION_HOURS: "12"
      PASSWORD_MIN_LENGTH: "8"
    expose:
      - "8000"
    networks:
      - backend
      - data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 100
        reservations:
          memory: 128M
    logging: *logging

  nginx:
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    <<: *hardening
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
          pids: 32
    logging: *logging

networks:
  frontend: {}
  backend:
    internal: true
  data:
    internal: true

volumes:
  pgdata:
    name: ${PG_VOLUME:-warehouse_stage_pgdata}
