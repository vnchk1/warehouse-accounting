# Инструменты проверки, которые не ставятся через pip (make tools, tools/install_tools.sh).
# Одни и те же версии и файлы — у разработчика, на сервере и в CI. Каждый архив
# проверяется по SHA-256 (значения — из файлов *_checksums.txt релизов на GitHub).
# Обновление версии — отдельная задача: новая строка, хеш из checksums.txt, make verify.
