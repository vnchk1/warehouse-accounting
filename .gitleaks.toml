# Настройки поиска секретов (make secrets, tools/secrets.sh). Критический файл приёмки:
# изменения проверяют владельцы из .github/CODEOWNERS.
#
# Используются все стандартные правила gitleaks (ключи облаков, токены GitHub/GitLab,
# закрытые ключи, «generic-api-key» и др.) и одно правило проекта — пароль в адресе базы.
# Исключений по путям нет: проверяются только файлы, которые попадают в репозиторий.
# Ложное срабатывание отмечается в самой строке: «gitleaks:allow — причина».

title = "Складской учёт: поиск секретов"

[extend]
useDefault = true

[[rules]]
id = "warehouse-database-url"
description = "Пароль в адресе подключения к PostgreSQL"
# пароль — не короче 12 символов ASCII; подстановки ${…} и заглушки «ПАРОЛЬ» не подходят
regex = '''postgres(?:ql)?(?:\+psycopg)?://[A-Za-z0-9_.-]+:([A-Za-z0-9_\-.~%]{12,})@'''
secretGroup = 1
entropy = 3.0
keywords = ["postgres"]
